name: Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: debug-apk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Check provisioned Android SDK
        id: android_sdk
        shell: bash
        run: |
          if compgen -G "${ANDROID_HOME:-}/platforms/android-37*/android.jar" > /dev/null; then
            echo 'installed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'installed=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Install missing Android SDK
        if: steps.android_sdk.outputs.installed != 'true'
        timeout-minutes: 5
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0'
          log-accepted-android-sdk-licenses: false
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Verify reproducible vendored icons
        run: |
          python3 checks/export_tabler.py
          git diff --exit-code -- app/src/main/kotlin/dev/tqmane/befuck/ui/TablerIcon.kt app/src/main/res/drawable
      - name: Build and verify
        run: bash ./gradlew --no-daemon --continue :app:assembleDebug :app:checkModule :app:testDebugUnitTest :app:lintDebug
      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: BeFuck-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: BeFuck-reports-${{ github.run_number }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
