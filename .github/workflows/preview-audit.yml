name: Saved media preview verification
on:
  push:
    branches: [feat/sqlite-archive-backup]
    paths: ['.preview/run']
permissions:
  contents: write
concurrency:
  group: preview-audit
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Check installed SDK
        run: test -n "$ANDROID_HOME" && compgen -G "$ANDROID_HOME/platforms/android-37*/android.jar"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
      - name: Apply reviewed integration
        run: |
          python3 .preview/apply.py
          for f in .preview/fix-*.py; do [ ! -f "$f" ] || python3 "$f"; done
      - name: Retain integrated source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app docs README* checks NOTICE
          if ! git diff --cached --quiet; then
            git commit -m 'feat: integrate saved camera previews and fullscreen viewer [skip ci]'
            git -c 'credential.helper=!f() { echo username=x-access-token; echo password=$GH_TOKEN; }; f' push origin HEAD:feat/sqlite-archive-backup
          fi
      - name: Build and exercise behavior
        run: |
          mkdir -p build
          set -o pipefail
          bash ./gradlew --no-daemon --continue :app:assembleDebug :app:checkModule :app:testDebugUnitTest :app:lintDebug 2>&1 | tee build/preview-audit.log
      - name: Record test evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,subprocess,shutil,xml.etree.ElementTree as ET
          dest=Path('.preview/results');dest.mkdir(parents=True,exist_ok=True)
          result={'commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'suites':[]}
          for p in Path('app/build/test-results').rglob('TEST-*.xml'):
              x=ET.parse(p).getroot();result['suites'].append({'name':x.get('name'),'tests':x.get('tests'),'failures':x.get('failures'),'skipped':x.get('skipped'),'errors':[e.text for e in x.iter('failure')]})
          (dest/'tests.json').write_text(json.dumps(result,indent=2,ensure_ascii=False))
          p=Path('build/preview-audit.log')
          if p.exists():
              lines=p.read_text().splitlines();(dest/'build.txt').write_text('\n'.join([x for x in lines if x.startswith('e:')]+lines[-80:]).replace(str(Path.cwd()),'<workspace>'))
          for p in Path('app/build/reports/ui').glob('saved-camera-*.png'):
              out=Path('docs/ui');out.mkdir(parents=True,exist_ok=True);shutil.copy(p,out/p.name)
          PY
          git add .preview/results docs/ui
          if ! git diff --cached --quiet; then
            git commit -m 'test: retain saved media rendering and runtime evidence [skip ci]'
            git -c 'credential.helper=!f() { echo username=x-access-token; echo password=$GH_TOKEN; }; f' push origin HEAD:feat/sqlite-archive-backup
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: BeFuck-preview-verification
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/apk/debug/app-debug.apk
            build/preview-audit.log
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          path: app/build/reports/ui/saved-camera-previews.png
          archive: false
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          path: app/build/reports/ui/saved-camera-fullscreen.png
          archive: false
          retention-days: 7
          if-no-files-found: ignore
